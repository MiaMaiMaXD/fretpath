name: Nightly

# Every night at 02:00 Thailand time:
#   full-suite  - all Playwright projects (chromium, firefox, mobile) against a local build + local Supabase
#   production  - read-only smoke test against PROD_URL, then Lighthouse (NFR-07, TC-PERF-01)
# Note: GitHub disables scheduled workflows after 60 days without repo activity.
# To re-enable, see docs/deploy/secrets.md.

on:
  schedule:
    - cron: "0 19 * * *" # 19:00 UTC = 02:00 Thailand
  workflow_dispatch:

concurrency:
  group: nightly
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  full-suite:
    name: full-suite
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - uses: supabase/setup-cli@v1
        with:
          version: 2.121.0

      - name: Start local Supabase
        run: supabase start

      - name: Export local Supabase env
        run: |
          supabase status -o env > "$RUNNER_TEMP/supabase.env"
          get() { grep -E "^$1=" "$RUNNER_TEMP/supabase.env" | head -n1 | cut -d= -f2- | sed -e 's/^"//' -e 's/"$//'; }
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$(get API_URL)"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$(get ANON_KEY)"
            echo "SUPABASE_SERVICE_ROLE_KEY=$(get SERVICE_ROLE_KEY)"
          } >> "$GITHUB_ENV"
          rm -f "$RUNNER_TEMP/supabase.env"

      - run: npm run build

      - run: npx playwright install --with-deps chromium firefox

      - name: Playwright (all tags, all browsers)
        run: npx playwright test --project=chromium --project=firefox --project=mobile

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
          if-no-files-found: ignore

  production:
    name: production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Only this job sees the production values (read-only smoke; no local Supabase here).
    env:
      PROD_URL: ${{ secrets.PROD_URL }}
      PROD_SUPABASE_URL: ${{ secrets.PROD_SUPABASE_URL }}
      PROD_SUPABASE_ANON_KEY: ${{ secrets.PROD_SUPABASE_ANON_KEY }}
    steps:
      - name: Check PROD_URL
        run: |
          if [ -z "${PROD_URL:-}" ]; then
            echo "::error::PROD_URL secret is not set"
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - name: Production smoke (read-only)
        run: npx playwright test --project=prod

      # Runs even if the smoke step failed, so performance is measured every night.
      # The PROD_URL guard above fails the job first, so this never runs with an empty URL.
      - name: Lighthouse (NFR-07)
        if: ${{ !cancelled() }}
        run: |
          if [ -z "${PROD_URL:-}" ]; then
            echo "::error::PROD_URL secret is not set"
            exit 1
          fi
          npx lhci autorun --collect.url="${PROD_URL%/}/"

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-production
          path: playwright-report/
          retention-days: 14
          if-no-files-found: ignore

      - name: Lighthouse summary
        if: ${{ !cancelled() }}
        run: |
          node -e '
            const fs = require("fs");
            const dir = ".lighthouseci";
            const files = fs.existsSync(dir) ? fs.readdirSync(dir).filter(f => /^lhr-.*\.json$/.test(f)) : [];
            const med = a => a.sort((x, y) => x - y)[Math.floor(a.length / 2)];
            const runs = files.map(f => JSON.parse(fs.readFileSync(`${dir}/${f}`, "utf8")));
            if (!runs.length) { console.log("no Lighthouse results"); process.exit(0); }
            const lcp = med(runs.map(r => r.audits["largest-contentful-paint"].numericValue));
            const tti = med(runs.map(r => r.audits["interactive"]?.numericValue ?? NaN));
            const tbt = med(runs.map(r => r.audits["total-blocking-time"].numericValue));
            const a11y = med(runs.map(r => r.categories.accessibility.score));
            const out = `| metric (median of ${runs.length}) | value |\n|---|---|\n| LCP | ${Math.round(lcp)} ms |\n| TTI | ${Math.round(tti)} ms |\n| TBT | ${Math.round(tbt)} ms |\n| accessibility | ${a11y} |\n`;
            console.log(out);
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `### Lighthouse (production)\n\n${out}`);
          '

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: .lighthouseci/
          # upload-artifact v4 skips dot-directories unless told otherwise.
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: warn
